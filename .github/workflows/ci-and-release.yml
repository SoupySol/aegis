name: Build, Verify & Attest

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-verify:
    name: Build, Test & Verify
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: extension/package-lock.json

      - name: Build Browser Guard + Standalone Clip Guard & run unit + security suites
        shell: pwsh
        run: ./scripts/build.ps1 -InstallDeps

      - name: Install Playwright Chromium & run E2E suites
        working-directory: extension
        run: |
          npx playwright install chromium
          node tests/e2e/e2e.mjs
          node tests/e2e/e2e-qa-deep.mjs

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: aegis-release-bundles
          path: |
            dist/Aegis-BrowserGuard.zip
            dist/Aegis-ClipGuard-Windows.zip
            dist/aegis-clipguard.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Generate GitHub build provenance attestation (tagged releases)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*'
